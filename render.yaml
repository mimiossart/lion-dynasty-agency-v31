services:
  - type: web
    name: lion-dynasty-agency-new
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lion-dynasty-db
          property: connectionString

databases:
  - name: lion-dynasty-db
    plan: basic-256mb
    databaseName: lion_dynasty_agency
    user: lion_dynasty_app
